name: Release builds

# Exports the Godot client for Web + desktop (Windows / Linux) and publishes
# them as GitHub Release assets. Mirrors the native client's tag-driven release:
# push a v* tag to cut a release.
#
#   gravebound-godot-web.zip     -> deploy-remote.bat pulls this to the /play mount
#   gravebound-godot-windows.zip -> single GraveBound.exe (pck embedded)
#   gravebound-godot-linux.zip   -> single GraveBound.x86_64 (pck embedded)
#   gravebound-godot-macos.zip   -> GraveBound.app (universal x86_64+arm64, UNSIGNED)
#
# The macOS .app is UNSIGNED: CI has no Apple Developer certificate, so codesign
# + notarization are disabled in the export preset. Gatekeeper blocks it on first
# launch -- users right-click the .app -> Open, or run
# `xattr -dr com.apple.quarantine GraveBound.app` once. Exporting the .app to a
# .zip works on the Linux runner (a .dmg would need a macOS host).
#
# Exports run with the standard (non-Mono) Godot 4.7.2 headless binary -- the
# Mono build refuses web exports (see export_presets.cfg). The Web preset has
# thread support off so the page needs no COOP/COEP headers.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-builds
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  PROJECT_DIR: .
  WEB_ASSET: gravebound-godot-web.zip
  WIN_ASSET: gravebound-godot-windows.zip
  LINUX_ASSET: gravebound-godot-linux.zip
  MAC_ASSET: gravebound-godot-macos.zip

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Cache Godot editor + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          # Bumped from the web-only key: desktop exports need the full template set.
          key: godot-${{ env.GODOT_VERSION }}-all-templates-v1

      - name: Install Godot ${{ env.GODOT_VERSION }} + all export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"

          fetch() {
            curl -sSL --retry 5 --retry-all-errors --retry-delay 5 \
              --speed-limit 100000 --speed-time 30 --max-time 900 -o "$2" "$1"
          }

          echo "== editor binary"
          mkdir -p ~/godot
          fetch "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" /tmp/godot.zip
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          rm -f /tmp/godot.zip

          # The templates archive (.tpz) is a zip covering every platform (~1 GB
          # unpacked). We now export desktop targets too, so extract the whole
          # set into the version dir Godot looks in rather than cherry-picking web.
          echo "== export templates (all platforms)"
          TPL_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$TPL_DIR"
          fetch "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" /tmp/templates.tpz
          unzip -oq /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* "$TPL_DIR"/
          rm -rf /tmp/templates.tpz /tmp/tpl
          ls -la "$TPL_DIR"

      - name: Godot version
        run: ~/godot/godot --headless --version

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          # The auto-updater reads application/config/version and compares it to
          # the latest release tag, so bake the tag in before exporting.
          sed -i "s|^config/version=.*|config/version=\"$VER\"|" project.godot
          grep '^config/version=' project.godot

      - name: Import project
        run: ~/godot/godot --headless --path "$PROJECT_DIR" --import

      - name: Export all targets
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/web build/windows build/linux build/macos

          # export-release can exit non-zero on non-fatal warnings, so verify the
          # artifact exists rather than trusting the exit code.
          export_target() {
            local preset="$1" out="$2" must="$3"
            echo "== export $preset -> $out"
            ~/godot/godot --headless --path "$PROJECT_DIR" --export-release "$preset" "$out" || true
            test -f "$must" || { echo "export '$preset' produced no $must" >&2; exit 1; }
          }

          export_target "Web"             build/web/index.html    "build/web/index.wasm"
          export_target "Windows Desktop" build/windows/GraveBound.exe "build/windows/GraveBound.exe"
          export_target "Linux"           build/linux/GraveBound.x86_64 "build/linux/GraveBound.x86_64"
          # macOS exports the .app bundled into a .zip (works headless on Linux; a
          # .dmg would need a macOS host). Non-fatal: a mac-export hiccup must never
          # block the proven Web/Windows/Linux release — it's packaged only if present.
          echo "== export macOS -> build/macos/GraveBound.zip"
          ~/godot/godot --headless --path "$PROJECT_DIR" --export-release "macOS" build/macos/GraveBound.zip || true
          if [ -f build/macos/GraveBound.zip ]; then echo "macOS export OK"; else echo "WARNING: macOS export produced nothing — continuing without it"; fi

          chmod +x build/linux/GraveBound.x86_64
          ls -la build/web build/windows build/linux build/macos || true

      # The Windows .exe icon is the committed, pre-built multi-size gravebound.ico
      # (a proper square GraveBound emblem — converting the wide wordmark icon.png
      # produced an .ico rcedit rejected). It rides along in the build artifact and
      # is embedded natively in the brand-windows job.
      - name: Stage committed Windows .ico
        run: |
          set -euo pipefail
          test -f gravebound.ico
          ls -la gravebound.ico

      - name: Package release zips
        run: |
          set -euo pipefail
          # index.html at the zip root so it unpacks straight into the /play mount.
          (cd build/web && zip -r "$GITHUB_WORKSPACE/$WEB_ASSET" .)
          (cd build/windows && zip "$GITHUB_WORKSPACE/$WIN_ASSET" GraveBound.exe)
          (cd build/linux && zip "$GITHUB_WORKSPACE/$LINUX_ASSET" GraveBound.x86_64)
          # The macOS export is already a .zip of GraveBound.app -- ship it as-is if
          # it was produced (export is non-fatal above).
          [ -f build/macos/GraveBound.zip ] && cp build/macos/GraveBound.zip "$GITHUB_WORKSPACE/$MAC_ASSET" || echo "no macOS asset to package"
          ls -la "$WEB_ASSET" "$WIN_ASSET" "$LINUX_ASSET" || true
          ls -la "$MAC_ASSET" 2>/dev/null || true

      - name: Upload zips as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gravebound-godot-builds
          path: |
            ${{ env.WEB_ASSET }}
            ${{ env.WIN_ASSET }}
            ${{ env.LINUX_ASSET }}
            ${{ env.MAC_ASSET }}
            gravebound.ico
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.WEB_ASSET }}
            ${{ env.WIN_ASSET }}
            ${{ env.LINUX_ASSET }}
            ${{ env.MAC_ASSET }}
          generate_release_notes: true
          draft: false
          prerelease: false
          # Keep releases/latest/download/*.zip pointing here regardless of
          # tag-push ordering -- deploy-remote.bat pulls the web zip from there.
          make_latest: 'true'

  # Embed the .exe icon on a NATIVE Windows runner. rcedit is a Windows binary;
  # running it under wine on the Linux release job silently no-ops, so the .exe
  # kept shipping the default Godot icon. Here it runs natively, then overwrites
  # the windows zip asset on the same release. Separate job so a hiccup never
  # blocks the web/linux release.
  brand-windows:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: gravebound-godot-builds

      - name: Brand .exe icon (native rcedit) and repackage
        shell: pwsh
        run: |
          Expand-Archive -Force "$env:WIN_ASSET" winout
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" `
            -OutFile rcedit.exe
          .\rcedit.exe "winout\GraveBound.exe" --set-icon gravebound.ico
          if ($LASTEXITCODE -ne 0) {
            # Icon embedding is cosmetic; a bad .ico must not fail the release. Ship
            # the exe with its default icon rather than dropping the Windows build.
            Write-Warning "rcedit failed (exit $LASTEXITCODE); shipping GraveBound.exe without an embedded icon"
          }
          Remove-Item "$env:WIN_ASSET"
          Compress-Archive -Path "winout\GraveBound.exe" -DestinationPath "$env:WIN_ASSET" -Force

      - name: Re-upload branded windows zip to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.WIN_ASSET }}
